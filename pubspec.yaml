name: mugiten
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 0.6.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  jadb:
    git:
      url: https://git.pvv.ntnu.no/mugiten/jadb.git

  kanimaji:
    git:
      url: https://git.pvv.ntnu.no/mugiten/kanimaji-dart.git

  animated_size_and_fade: ^5.1.1
  archive: ^4.0.7
  async: ^2.13.0
  collection: ^1.19.0
  cupertino_icons: ^1.0.8
  division: ^0.9.0
  file_picker: ^12.0.0-beta.3
  flutter_bloc: ^9.1.0
  flutter_markdown_plus: ^1.0.3
  flutter_settings_ui: ^3.0.1
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.0.17
  get_it: ^9.0.5
  google_fonts: ^8.0.2
  google_mlkit_digital_ink_recognition: ^0.14.1
  http: ^1.3.0
  infinite_scroll_pagination: ^5.1.0
  markdown: ^7.3.0
  mdi: ^5.0.0-nullsafety.0
  package_info_plus: ^10.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  ruby_text: ^3.0.3
  sealed_languages: ^3.0.0
  share_plus: ^13.1.0
  shared_preferences: ^2.5.3
  signature: ^6.3.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqlite3: ^3.0.0
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.1
  code_assets: ^1.2.1
  hooks: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/components/
    - assets/images/links/
    - assets/images/logo/
    - assets/kanjivg/kanji/
    - assets/licenses/
    - docs/changelog/
    - lib/services/database/schemas/v1/
    - lib/services/database/schemas/v2/

  fonts:
    - family: Droid Sans Japanese
      fonts:
        - asset: assets/fonts/DroidSansJapanese.ttf
