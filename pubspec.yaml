name: mugiten
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_size_and_fade: ^5.1.1
  collection: ^1.19.0
  confirm_dialog: ^1.0.4
  division: ^0.9.0
  file_picker: ^10.1.2
  flutter_bloc: ^9.1.0
  flutter_settings_ui: ^3.0.1
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.0.17
  get_it: ^8.0.3
  http: ^1.3.0
  jadb:
    git:
      url: https://git.pvv.ntnu.no/oysteikt/jadb.git
  mdi: ^5.0.0-nullsafety.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sembast: ^3.8.3
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  signature: ^5.5.0
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  sqlite3_flutter_libs: ^0.5.32
  sqflite_common_ffi: ^2.3.4+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/components/
    - assets/images/links/
    - assets/images/logo/
    - assets/licenses/

  fonts:
    - family: Droid Sans Japanese
      fonts:
        - asset: assets/fonts/DroidSansJapanese.ttf

    - family: Noto Sans CJK
      fonts:
        - asset: assets/fonts/NotoSansCJK-Regular.ttc

    - family: Noto Serif CJK
      fonts:
        - asset: assets/fonts/NotoSerifCJK-Regular.ttc
