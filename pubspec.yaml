name: mugiten
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 0.5.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animated_size_and_fade: ^5.1.1
  collection: ^1.19.0
  division: ^0.9.0
  file_picker: ^10.2.0
  flutter_bloc: ^9.1.0
  flutter_settings_ui: ^3.0.1
  flutter_slidable: ^4.0.0
  flutter_svg: ^2.0.17
  get_it: ^9.0.5
  http: ^1.3.0
  jadb:
    git:
      url: https://git.pvv.ntnu.no/oysteikt/jadb.git
  mdi: ^5.0.0-nullsafety.0
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  signature: ^6.3.0
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  sqlite3_flutter_libs: ^0.6.0+eol
  sqflite_common_ffi: ^2.3.4+4
  ruby_text: ^3.0.3
  sqlite3: ^3.0.0
  google_mlkit_digital_ink_recognition: ^0.14.1
  archive: ^4.0.7
  package_info_plus: ^9.0.0
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.0
  sealed_languages: ^3.0.0
  infinite_scroll_pagination: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/components/
    - assets/images/links/
    - assets/images/logo/
    - assets/licenses/
    - docs/changelog/
    - migrations/

  fonts:
    - family: Droid Sans Japanese
      fonts:
        - asset: assets/fonts/DroidSansJapanese.ttf

    - family: Noto Sans CJK
      fonts:
        - asset: assets/fonts/NotoSansCJK-Regular.ttc

    - family: Noto Serif CJK
      fonts:
        - asset: assets/fonts/NotoSerifCJK-Regular.ttc
